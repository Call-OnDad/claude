# Caddy reverse proxy config for headscale — NEXUS
# Import this into your main Caddyfile with:
#   import /path/to/nexus/headscale/caddy-snippet.conf
#
# BEFORE ENABLING:
#   1. mesh.call-on.media DNS must point to your server's IP with Cloudflare
#      proxy set to DNS-ONLY (grey cloud). Orange-cloud proxying breaks the
#      Tailscale Noise protocol (/ts2021 POST-upgrade TCP hijack).
#   2. headscale and headscale-admin containers must be on the "proxy" Docker network.
#   3. Add mesh.call-on.media to your cloudflare-ddns config (proxied: false).
#
# Caddy handles the Noise protocol correctly out of the box:
#   - Non-standard "Upgrade: tailscale-control-protocol" headers are forwarded transparently
#   - No transport h2c or explicit upgrade directives needed (would break things)
#   - Caddy provisions the TLS cert automatically via ACME

# headscale control plane
mesh.call-on.media {
    # Tailscale captive portal detection — required by iOS/Android clients
    handle /generate_204 {
        respond 204
    }

    # All other traffic proxied to headscale container
    reverse_proxy headscale:8080 {
        header_up X-Real-IP       {remote_host}
        header_up X-Forwarded-For {remote_host}
        header_up X-Forwarded-Proto {scheme}
    }
}

# headscale-admin web UI
# On first load: set headscale URL to https://mesh.call-on.media and enter your API key
headscale-admin.call-on.media {
    reverse_proxy headscale-admin:80
}
